name: Gmail Cleanup Agent

on:
  schedule:
    # 22:00 v ČR odpovídá 20:00 UTC (v zimním čase) nebo 21:00 UTC (v letním čase)
    # Cron '0 20 * * *' spustí skript každý den ve 22:00 SEČ
    - cron: '0 20 * * *'
  workflow_dispatch: # Ponecháme i možnost spustit ručně v GitHubu

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Cleanup Script
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python cleanup_agent.py

      - name: Commit stats and report date update
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto: Update agent stats and report schedule"
          file_pattern: "last_report.txt stats.json"
