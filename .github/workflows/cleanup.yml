name: Gmail Cleanup Agent

on:
  schedule:
    - cron: '0 6 * * 1' # Spustí se každé pondělí v 6:00
  workflow_dispatch: # Umožňuje ruční spuštění kdykoliv jedním kliknutím

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Povolení pro uložení souborů s datem a statistikami zpět do repozitáře
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Cleanup Script
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python cleanup_agent.py

      - name: Commit stats and report date update
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto: Update agent stats and report schedule"
          file_pattern: "last_report.txt stats.json"
