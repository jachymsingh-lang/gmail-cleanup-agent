name: Gmail Cleanup Agent

on:
  schedule:
    # Denně v 18:00 UTC (19:00 / 20:00 českého času podle letního času)
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (jen vypsat, co by se stalo - nic nearchivovat ani nemazat)"
        type: boolean
        default: true
      force_report:
        description: "Poslat report přes Resend i mimo 14denní cyklus"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gmail-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Gmail Cleanup Agent
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          FORCE_REPORT: ${{ inputs.force_report || false }}
        run: python cleanup_agent.py
